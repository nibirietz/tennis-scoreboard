[project]
name = "tennis-scoreboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nibirietz", email = "nibirietz@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "msgspec>=0.22.0",
    "mypy>=2.4.1",
    "waitress>=3.0.2",
]

[project.scripts]
tennis-scoreboard = "tennis_scoreboard.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]


[tool.basedpyright]
include = ["src", "test"]


[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = [
    "tests",
]
pythonpath = ["src"]
